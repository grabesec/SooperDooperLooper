# Example SDL configuration: roll over root passwords on Linux VMs and keep
# them in HashiCorp Vault. Validate with: sdl check-config -c sdl.yaml

modules:
  # Every system and user action is appended here, hash-chained so tampering shows.
  audit:
    type: audit.jsonl
    config:
      path: /var/lib/sdl/audit.jsonl

  # Copies of the audit log for a log concentrator; see docs/logs.md.
  # Forwarding never slows down or blocks the local audit log above.
  # syslog:
  #   type: forwarder.syslog
  #   config:
  #     host: logs.example.com
  #     protocol: tls          # udp, tcp or tls
  #     ca_cert: /etc/sdl/logs-ca.pem
  # graylog:
  #   type: forwarder.gelf
  #   config:
  #     url: http://graylog.example.com:12201/gelf
  # splunk:
  #   type: forwarder.splunk_hec
  #   config:
  #     url: https://splunk.example.com:8088
  #     token_env: SPLUNK_HEC_TOKEN
  #     index: security
  #     exclude_actions: [api.request]   # skip read-only API calls

  # SDL's users: local accounts (password + TOTP) and records of directory
  # users. Manage them with `sdl users ...` or on the web page. See docs/users.md.
  users:
    type: users.store
    config:
      path: /var/lib/sdl/users.json

  # Sign in with Active Directory accounts; groups decide roles and systems.
  # ad:
  #   type: idp.ldap
  #   config:
  #     display_name: Contoso AD
  #     directory: active_directory
  #     urls: [ldaps://dc1.contoso.com]
  #     bind_dn: sdl-search@contoso.com
  #     bind_password_env: SDL_LDAP_PASSWORD
  #     user_base_dn: OU=Staff,DC=contoso,DC=com
  #     group_base_dn: OU=Groups,DC=contoso,DC=com
  #     group_mapping:
  #       - {group: SDL-Admins, roles: [admin], all_systems: true}
  #       - {group: Web-Operators, roles: [operator], groups: [web]}

  # Single sign-on with Microsoft Entra ID (or Okta, Keycloak, Google...).
  # entra:
  #   type: idp.oidc
  #   config:
  #     display_name: Entra ID
  #     issuer: https://login.microsoftonline.com/<tenant id>/v2.0
  #     client_id: <application id>
  #     client_secret_env: SDL_OIDC_SECRET
  #     group_mapping:
  #       - {group: <group object id>, roles: [auditor], all_systems: true}

  # API tokens for scripts and other machine clients.
  # Create entries with: sdl token new --id <name> --role operator
  # auth:
  #   type: auth.static_token
  #   config:
  #     clients:
  #       - id: ci
  #         token_sha256: "<hash printed by sdl token new>"
  #         roles: [operator]
  #         access: {groups: [web]}

  # SDL's own inventory of systems (hostnames, FQDNs, IPs, service accounts).
  # Add systems with `sdl systems add ... --inventory inventory` or on the web page.
  inventory:
    type: inventory.store
    config:
      path: /var/lib/sdl/inventory.json

  # Systems can also come from NetBox (read-only). See docs/inventory.md.
  # netbox:
  #   type: inventory.netbox
  #   config:
  #     url: https://netbox.example.com
  #     token_env: NETBOX_TOKEN
  #     filters: {status: active, tag: sdl}
  #     defaults:
  #       secret_path: "linux/{name}/{account}"
  #       service_account: {username: sdl-svc, credential_path: "svc/sdl-svc"}

  passwords:
    type: generator.password
    config:
      length: 32

  vault:
    type: secrets.vault
    config:
      url: https://vault.example.com:8200
      mount: secret          # KV v2 mount
      path_prefix: sdl       # secrets land at secret/data/sdl/<secret_path>
      auth_method: token     # or approle (role_id + VAULT_SECRET_ID env var)
      token_env: VAULT_TOKEN

  linux:
    type: target.ssh_linux
    config:
      # Default service account, for systems that do not name one whose key
      # is kept in the secrets module.
      username: sdl-svc
      private_key_path: /etc/sdl/ssh/id_ed25519
      known_hosts_path: /etc/sdl/ssh/known_hosts
      verify_method: su      # or ssh_login

# Systems can also be listed right here; they show up as inventory "sdl.yaml".
targets:
  - name: web1
    host: 10.0.0.11
    module: linux
    account: root
    secret_path: linux/web1/root
    groups: [web]
  - name: web2
    host: 10.0.0.12
    module: linux
    account: root
    secret_path: linux/web2/root
    groups: [web]
  - name: db1
    host: 10.0.0.21
    port: 2222
    module: linux
    account: root
    secret_path: linux/db1/root
    groups: [db]

rollover:
  max_parallel: 5

identity:
  # Create with: sdl superuser set -f /etc/sdl/superuser.json --name sdladmin
  superuser_file: /etc/sdl/superuser.json
  require_mfa: true          # local users must set up an authenticator app
  # session_ttl: 28800       # seconds a sign-in lasts at most
  # session_idle: 3600       # ... and without activity
  # max_failed_logins: 5
  # lockout: 900
# api:
#   public_url: https://sdl.example.com   # for single sign-on behind a reverse proxy
